<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </meta>
    <title>Pokemons</title>
</head>

<body>
    <div><button id="botaoCarregar">Carregar Pokemons</button></div>
    <div id="Pokemons"></div>
</body>

<script>

    let Pokemons = []

    const carregarDiv = cs => {
        const div = document.getElementById("Pokemons")

        const itensHtml = cs.map(item => `
            <div class="pokemon-card">
                <img src="${item.sprites.front_shiny}" alt="${item.name}">
                <div>#${item.id}</div>
                <strong>${item.name}</strong>
                <small>${item.types.map(t => t.type.name).join(', ')}</small>
            </div>
        `)

        div.innerHTML = `${itensHtml.join("\n")}`
    }

    async function carregarPokemons() {
        try {
            document.getElementById("Pokemons").innerHTML = "<div>Carregando...</div>"

            let res = await fetch("https://pokeapi.co/api/v2/pokemon?limit=151")
            Pokemons = await res.json()

            const promessasDetalhes = Pokemons.results.map(async (item) => {
                let resDetalhes = await fetch(item.url)
                return await resDetalhes.json()
            })

            const detalhesPokemons = await Promise.all(promessasDetalhes)

            carregarDiv(detalhesPokemons)

        } catch (err) {
            document.getElementById("Pokemons").innerHTML = `<div>Erro ao carregar Pokemons: ${err.message}</div>`
        }
    }

    let botao = document.getElementById("botaoCarregar")
    botao.addEventListener("click", () => carregarPokemons())

</script>

</html>
