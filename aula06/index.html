<!DOCTYPE html>
<html>

<head>
    <link href="estilo.css" rel="stylesheet">
    <meta charset="UTF-8">
    <style>
        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
    </style>
</head>

<body>
    <div><button id="botaoCarregar">Carregando cervejas...</button></div>
    <div id="cervejasDiv"></div>
</body>

<script>

    let cervejas = [
        {
            name: "Guiness",
            alcohol: "10%",
            style: "Imperial Stout",
            ibu: "45"
        },
        {
            name: "Desperados",
            alcohol: "6%",
            style: "Lager",
            ibu: "20"
        },
        {
            name: "Becks",
            alcohol: "5%",
            style: "Pilsen",
            ibu: "25"
        }
    ]

    // cs é um array de cervejas
    const carregarTabela = (cs, elementoId = "cervejasDiv") => {
        const div = document.getElementById(elementoId)

        const linhasHtml = cs.map( (item) => {
            return `
               <td>${item['name']}</td>
               <td>${item['alcohol']}</td>
               <td>${item['style']}</td>
               <td>${item['ibu']}</td>
            </tr>`
         })

         const tabelaHtml = `
            <table>
               <thead>
                  <tr>
                     <th>Nome</th>
                     <th>Álcool</th>
                     <th>Estilo</th>
                     <th>IBU</th>
                  </tr>
               </thead>
               <tbody>
                  ${linhasHtml.join("\n")}
               </tbody>
            </table>
         `

         div.innerHTML = tabelaHtml
      }

    let botao = document.getElementById("botaoCarregar")
    botao.addEventListener("click", () => carregarTabela(cervejas) )

</script>

</html>
