<!DOCTYPE html>
<html>

<head>
   <title>Receita 5</title>
   <meta charset="UTF-8">
   <link href="estilo.css" rel="stylesheet">
</head>

<body>
   <a href="#" id="linkCarregar" class="linkAcao">Carregar Roupas</a>
   <a href="#" id="linkOrdenar" class="linkAcao">Carregar Roupas</a>
   <a href="#" id="linkEmbaralhar" class="linkAcao">Carregar Roupas</a>

   <div id="loucura"></div>
</body>

<script>
   let roupas = ["short", "calça", "blusas", "vestido", "casaco"];

   const transformarTabela = (lista) => {
      let linhas = lista.map(item => `<tr><td>${item}</td></tr>`).join("\n");
      return ` 
         <table>
            <thead>
               <tr><th>Peça de Roupa</th></tr>
            </thead>
            <tbody>
               ${linhas}
            </tbody>
         </table>
      `;
   }

   const carregarDivTabela = (lista) => {
      const div = document.getElementById("loucura")

      div.innerHTML = transformarTabela(lista);
   };

   const carregarOrdenadas = (lista) => {
      const div = document.getElementById("loucura");

      let listaOrdenada = [...lista].sort((a, b) => a.localeCompare(b));

      div.innerHTML = transformarTabela(listaOrdenada)

   };

   const carregarEmabaralhadas = (lista) => {
      const div = document.getElementById("loucura")
      let listaEmabalhada = [...lista].sort(() => Math.random() - 0.5);

      div.innerHTML = transformarTabela(listaEmabalhada);
   }

   let linkCarregar = document.getElementById("linkCarregar");
   linkCarregar.addEventListener("click", (event) => {
      carregarDivTabela(roupas);
   });

   let linkOrdenar = document.getElementById("linkOrdenar");
   linkOrdenar.addEventListener("click", (event) => {
      carregarOrdenadas(roupas);
   });

   let linkEmbaralhar = document.getElementById("linkEmbaralhar");
   linkEmbaralhar.addEventListener("click", (event) => {
      carregarEmabaralhadas(roupas);
   });
</script>

</html>
